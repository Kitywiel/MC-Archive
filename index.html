<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>The Mc Archive</title>
        <style>
            @import url('https://fonts.cdnfonts.com/css/minecraft-4');

            body {
                margin: 0;
                align-self: center;
                color: white;
                text-align: center;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                flex-direction: column;
            }

            .bg-blur {
                /* background */
                background-image: url(./imgs/cave.png);
                background-position: center;
                background-size: cover;

                /* size */
                height: 110vh;
                width: 110vw;

                /* position */
                position: fixed;
                top: -15px;
                right: -15px;

                /* extras */
                overflow: hidden;
                filter: blur(8px);
                z-index: 0;
                }
                
            .content {
                /* text */
                color: white;
                text-align: center;

                /* others */
                font-family: 'Minecraft', sans-serif;
                align-self: center;
                z-index: 1;
        }
        </style>
    </head>
    <body>
        <div class="bg-blur"></div>
        <div class="content">
            <h1>The Minecraft Anarchy Archive</h1>
            <p> UNDER CONSTRUCTION</p>
        </div>
    </body>
</html>
